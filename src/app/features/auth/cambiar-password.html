<div class="pantalla">
  <form class="tarjeta" (ngSubmit)="guardar()">
    <h1>Cambia tu contraseña</h1>
    <p class="sub">
      Entraste con una contraseña temporal. Antes de continuar, elige una nueva que
      solo tú conozcas.
    </p>

    <div class="campo">
      <label for="actual">Contraseña actual</label>
      <input
        id="actual"
        type="password"
        autocomplete="current-password"
        [ngModel]="passwordActual()"
        (ngModelChange)="passwordActual.set($event)"
        name="actual"
        [disabled]="enviando()"
        autofocus
      />
    </div>

    <div class="campo">
      <label for="nueva">Contraseña nueva</label>
      <input
        id="nueva"
        type="password"
        autocomplete="new-password"
        [ngModel]="passwordNueva()"
        (ngModelChange)="passwordNueva.set($event)"
        name="nueva"
        [disabled]="enviando()"
      />
      <span class="ayuda">Al menos 8 caracteres.</span>
    </div>

    <div class="campo">
      <label for="confirmar">Repite la contraseña nueva</label>
      <input
        id="confirmar"
        type="password"
        autocomplete="new-password"
        [ngModel]="passwordConfirmar()"
        (ngModelChange)="passwordConfirmar.set($event)"
        name="confirmar"
        [disabled]="enviando()"
      />
    </div>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <button type="submit" class="btn-guardar" [disabled]="enviando()">
      {{ enviando() ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>
  </form>
</div>
