# =====================================================================
#  Tema de login FIBRA NET para Keycloak
#  Sistema Integral de Gestión ISP · Chordeleg, Azuay
#
#  parent=base  → heredamos solo el andamiaje FreeMarker (macros, i18n,
#  manejo de mensajes) SIN los estilos PatternFly del tema por defecto,
#  para tener control total del diseño con nuestro propio login.css.
# =====================================================================
parent=base
import=common/keycloak

# Hoja de estilos propia (se enlaza desde template.ftl vía ${properties.styles})
styles=css/login.css

# Clases que template.ftl aplica a <html> y <body>
kcHtmlClass=fn-html
kcBodyClass=fn-body

# Idioma
locales=es,en
